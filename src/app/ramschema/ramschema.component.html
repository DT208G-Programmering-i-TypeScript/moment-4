<h1 class="rubrik">Ramschema</h1>

<input type="text" [(ngModel)]="sokfras" (input)="filtreraKurser()" placeholder="Sök efter kurskod eller kursnamn...">

<table>
  <thead>
    <tr>
      <th (click)="sorteraKurser('code')">Kurskod <span *ngIf="sorteringsKolumn === 'code'">{{ stigandeOrdning ? '▲' : '▼' }}</span></th>
      <th (click)="sorteraKurser('coursename')">Kursnamn <span *ngIf="sorteringsKolumn === 'coursename'">{{ stigandeOrdning ? '▲' : '▼' }}</span></th>
      <th (click)="sorteraKurser('progression')">Progression <span *ngIf="sorteringsKolumn === 'progression'">{{ stigandeOrdning ? '▲' : '▼' }}</span></th>
      <th>Kursplan</th>
    </tr>
  </thead>
  <tbody>
    <tr class="animation" *ngFor="let kurs of filtreradeKurser">
      <td>{{ kurs.code }}</td>
      <td>{{ kurs.coursename }}</td>
      <td>{{ kurs.progression }}</td>
      <td><a [href]="kurs.syllabus" target="_blank">Länk</a></td>
    </tr>
  </tbody>
</table>
